name: GradHive Mobile

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**"]

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sh tool/setup.sh
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sh tool/setup.sh
      # Signature : secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PROPERTIES (voir docs/DEPLOIEMENT.md)
      - run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties
      - run: flutter build appbundle --release --dart-define=API_URL=${{ secrets.PROD_API_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: gradhive-aab, path: mobile/build/app/outputs/bundle/release/app-release.aab }

  ios:
    needs: test
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sh tool/setup.sh
      # Sans certificat Apple : compilation de vérification uniquement. La signature et l'envoi
      # vers TestFlight se font avec un compte Apple Developer (voir docs/DEPLOIEMENT.md).
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ secrets.PROD_API_URL }}

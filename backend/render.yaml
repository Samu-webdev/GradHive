# Blueprint Render : service web Docker pour l'API GradHive
services:
  - type: web
    name: gradhive-api
    runtime: docker
    plan: free
    healthCheckPath: /api/stats
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true     # ou collez la sortie de: php artisan key:generate --show
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false             # hôte fourni par Neon (ep-xxxx.neon.tech)
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CORS_ALLOWED_ORIGINS
        sync: false             # ex. https://gradhive.vercel.app
      - key: TOKEN_TTL_MINUTES
        value: "480"
      - key: GRADHIVE_FILES_DISK
        value: s3               # stockage durable des PDF (voir .env.example.gradhive)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto             # "auto" pour Cloudflare R2
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false             # ex. https://<compte>.r2.cloudflarestorage.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"           # mettre à false après le premier déploiement
